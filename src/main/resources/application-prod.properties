# Production on Render with a Neon Postgres database. All values come from Render environment variables.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
# Neon: use the direct (not "-pooler") address; Spring keeps its own small pool.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.h2.console.enabled=false

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Real tickets only. Set PILAGO_SAMPLE_DATA=true on Render for a demo day.
pilago.sample-data=${PILAGO_SAMPLE_DATA:false}

pilago.seed.secretary-password=${SECRETARY_PASSWORD}
pilago.seed.captain-password=${CAPTAIN_PASSWORD}
