<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <!-- Shared pieces for resident pages. Copy comes from the messages files through ${@bi}. -->

  <!-- <head>: page title, Nunito, theme CSS, favicon. withHtmx = true adds htmx for live pages. -->
  <head th:fragment="head(title, withHtmx)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title} + ' · PilaGo'">PilaGo</title>
    <link rel="icon" th:href="@{/favicon.ico}" href="../../static/favicon.ico" />
    <link rel="apple-touch-icon" th:href="@{/img/pilago-logo-180.png}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/pilago.css}" href="../../static/css/pilago.css" />
    <script th:if="${withHtmx}" src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  </head>

  <body>
    <!-- App header: logo, barangay, office hours (desktop) -->
    <header class="pg-header" th:fragment="header">
      <a class="pg-header__brand" th:href="@{/}">
        <img th:src="@{/img/pilago-logo-192.png}" src="../../static/img/pilago-logo-192.png" alt="" />
        <span><b>PilaGo</b><small>Brgy. San Isidro</small></span>
      </a>
      <span class="pg-header__meta">Office hours: Mon–Fri, 8 AM–5 PM</span>
    </header>

    <!-- Stepper: n = current step (1–3) -->
    <div class="pg-stepper" th:fragment="stepper(n)">
      <p class="pg-eyebrow" th:text="${@bi.t('resident.step.of', n)}">Step 1 of 3</p>
      <p class="pg-eyebrow pg-stepper__sub" th:text="${@bi.t('resident.step.' + n)}">Choose document</p>
      <div class="pg-stepper__bars" aria-hidden="true">
        <span th:each="i : ${#numbers.sequence(1, 3)}" th:class="${i < n} ? 'is-done' : (${i == n} ? 'is-now' : '')"></span>
      </div>
    </div>

    <!-- Mascot tip: the eagle says one line from a message key.
         variant: '', 'highlight', 'warning' or 'success'. Pass keys, not text: fragment
         parameters cannot call ${@bi} (Thymeleaf restricts them). -->
    <div th:fragment="tip(key, variant)" class="pg-tip" th:classappend="${variant != ''} ? 'pg-tip--' + ${variant}">
      <div class="pg-tip__bubble">
        <p class="pg-tip__message" th:text="${@bi.t(key)}">What document do you need today?</p>
      </div>
      <img class="pg-tip__eagle" th:src="@{/img/pilago-mascot-eagle-600.png}" src="../../static/img/pilago-mascot-eagle-600.png" alt="" />
    </div>

    <!-- Same, for a message with one {0} value (e.g. a ticket number) -->
    <div th:fragment="tipWith(key, value, variant)" class="pg-tip" th:classappend="${variant != ''} ? 'pg-tip--' + ${variant}">
      <div class="pg-tip__bubble">
        <p class="pg-tip__message" th:text="${@bi.t(key, value)}">You already have a ticket: C-004.</p>
      </div>
      <img class="pg-tip__eagle" th:src="@{/img/pilago-mascot-eagle-600.png}" src="../../static/img/pilago-mascot-eagle-600.png" alt="" />
    </div>

    <!-- Document icon (Feather file-text) -->
    <span th:fragment="docIcon" class="pg-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
        <polyline points="14 2 14 8 20 8" /><line x1="16" y1="13" x2="8" y2="13" /><line x1="16" y1="17" x2="8" y2="17" />
      </svg>
    </span>
  </body>
</html>
