<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/shared :: head('Choose document', false)}"></head>
  <body class="pg-root">
    <header th:replace="~{fragments/shared :: header}"></header>

    <!-- R2 / R12 · Step 1, choose document and purpose -->
    <form th:action="@{/request/document}" th:object="${form}" method="post">
      <main class="pg-page">
        <div th:replace="~{fragments/shared :: stepper(1)}"></div>
        <div th:replace="~{fragments/shared :: tip('resident.step1.tip', '')}"></div>

        <fieldset class="pg-fieldset">
          <legend class="pg-field__label" th:text="${@bi.t('resident.review.document')}">Document</legend>
          <label class="pg-card pg-choice" th:each="d : ${documents}">
            <span th:replace="~{fragments/shared :: docIcon}"></span>
            <span class="pg-doc__text">
              <b th:text="${@bi.t(d.messageKey)}">Barangay Clearance</b>
              <span class="pg-secondary" th:with="k=${'resident.doc.' + d.messageKey.substring(9)}"
                    th:text="${@bi.t(k)}">For jobs, school, loans</span>
              <span class="pg-fee" th:text="${feeRanges.get(d)}">₱0–50</span>
            </span>
            <input type="radio" th:field="*{documentType}" th:value="${d.name()}" />
          </label>
          <p class="pg-error" th:if="${#fields.hasErrors('documentType')}" th:errors="*{documentType}">Choose a document</p>
        </fieldset>

        <label class="pg-field">
          <span class="pg-field__label" th:text="${@bi.t('resident.field.purpose')}">Purpose</span>
          <select class="pg-input" th:field="*{purpose}" th:classappend="${#fields.hasErrors('purpose')} ? 'is-invalid'">
            <option value="" th:text="'— ' + ${@bi.t('resident.field.purpose')} + ' —'">— Purpose —</option>
            <option th:each="p : ${purposes}" th:value="${p.name()}" th:text="${@bi.t(p.messageKey)}">Employment</option>
          </select>
          <span class="pg-error" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}">Choose a purpose</span>
        </label>

        <div class="pg-feebox">
          <div>
            <b th:text="${@bi.t('resident.fee.title')}">Fee to pay at the counter</b>
            <p class="pg-muted" th:text="${@bi.t('resident.fee.note')}">Pay in person.</p>
          </div>
          <strong class="pg-feebox__amount" id="fee" aria-live="polite">—</strong>
        </div>

        <div class="pg-actions">
          <button class="pg-btn pg-btn--lg pg-btn--primary" type="submit" th:text="${@bi.t('cta.next')}">Next</button>
        </div>
      </main>
    </form>

    <!-- Shows the fee for the chosen document and purpose. The amounts come from the server
         (Document.getFee), so this script has no fee rules of its own. -->
    <script th:inline="javascript">
      const fees = /*[[${fees}]]*/ {};
      const feeBox = document.getElementById("fee");
      const purpose = document.querySelector("select[name=purpose]");
      function showFee() {
        const doc = document.querySelector("input[name=documentType]:checked");
        feeBox.textContent = doc && purpose.value ? fees[doc.value + "|" + purpose.value] : "—";
      }
      document.querySelectorAll("input[name=documentType]").forEach((r) => r.addEventListener("change", showFee));
      purpose.addEventListener("change", showFee);
      showFee();
    </script>
  </body>
</html>
