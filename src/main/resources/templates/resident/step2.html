<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/shared :: head('Your details', false)}"></head>
  <body class="pg-root">
    <header th:replace="~{fragments/shared :: header}"></header>

    <!-- R3 / R13 · Step 2, your details -->
    <form th:action="@{/request/details}" th:object="${form}" method="post" novalidate>
      <main class="pg-page">
        <div th:replace="~{fragments/shared :: stepper(2)}"></div>
        <div th:replace="~{fragments/shared :: tip('resident.step2.tip', '')}"></div>

        <label class="pg-field">
          <span class="pg-field__label" th:text="${@bi.t('resident.field.name')}">Full name · Buong pangalan</span>
          <input class="pg-input" type="text" th:field="*{fullName}" autocomplete="name" placeholder="Dela Cruz, Juan M."
                 th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" />
          <span class="pg-muted" th:text="${@bi.t('resident.field.name.hint')}">Last name, First name, M.I.</span>
          <span class="pg-error" th:if="${#fields.hasErrors('fullName')}" th:text="${#fields.errors('fullName')[0]}">Enter your full name</span>
        </label>

        <label class="pg-field">
          <span class="pg-field__label" th:text="${@bi.t('resident.field.age')}">Age · Edad</span>
          <!-- Text, not number: letters are caught on the server and explained (see ResidentPage). -->
          <input class="pg-input" type="text" inputmode="numeric" th:field="*{age}" id="age" placeholder="64"
                 th:classappend="${#fields.hasErrors('age')} ? 'is-invalid'" />
          <span class="pg-error" th:if="${#fields.hasErrors('age')}" th:text="${#fields.errors('age')[0]}">Numbers only</span>
          <span><span class="pg-tag pg-tag--senior" id="seniorTag" hidden th:text="${@bi.t('priority.senior')}">Senior 60+ · Nakatatanda</span></span>
        </label>

        <label class="pg-field">
          <span class="pg-field__label" th:text="${@bi.t('resident.field.address')}">Address · Tirahan</span>
          <input class="pg-input" type="text" th:field="*{address}" autocomplete="street-address" placeholder="123 Rizal St., Purok 4"
                 th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" />
          <span class="pg-muted" th:text="${@bi.t('resident.field.address.hint')}">House no., street, purok</span>
          <span class="pg-error" th:if="${#fields.hasErrors('address')}" th:text="${#fields.errors('address')[0]}">Enter your address</span>
        </label>

        <fieldset class="pg-fieldset">
          <legend class="pg-field__label" th:text="${@bi.t('resident.field.residency')}">How long have you lived here?</legend>
          <div class="pg-row2">
            <label class="pg-field">
              <span class="pg-field__label" th:text="${@bi.t('resident.field.years')}">Years · Taon</span>
              <input class="pg-input" type="number" min="0" max="130" inputmode="numeric" th:field="*{residencyYears}"
                     th:classappend="${#fields.hasErrors('residencyYears')} ? 'is-invalid'" />
            </label>
            <label class="pg-field">
              <span class="pg-field__label" th:text="${@bi.t('resident.field.months')}">Months · Buwan</span>
              <input class="pg-input" type="number" min="0" max="11" inputmode="numeric" th:field="*{residencyMonths}"
                     th:classappend="${#fields.hasErrors('residencyMonths')} ? 'is-invalid'" />
            </label>
          </div>
          <span class="pg-muted" th:text="${@bi.t('resident.field.residency.hint')}">At least 6 months</span>
          <span class="pg-error" th:if="${#fields.hasErrors('residencyYears')}" th:text="${#fields.errors('residencyYears')[0]}">Years</span>
          <span class="pg-error" th:if="${#fields.hasErrors('residencyMonths')}" th:text="${#fields.errors('residencyMonths')[0]}">Months</span>
        </fieldset>

        <label class="pg-card pg-check">
          <input type="checkbox" th:field="*{pwd}" />
          <span>
            <b th:text="${@bi.t('resident.field.pwd')}">I am a PWD · Ako ay may kapansanan</b>
            <span class="pg-secondary" th:text="${@bi.t('resident.field.pwd.hint')}">Bring your PWD ID.</span>
          </span>
        </label>
        <label class="pg-card pg-check">
          <input type="checkbox" th:field="*{hasPendingRecord}" />
          <span>
            <b th:text="${@bi.t('resident.field.record')}">Pending barangay record · May kaso sa barangay</b>
            <span class="pg-secondary" th:text="${@bi.t('resident.field.record.hint')}">The secretary will check it first.</span>
          </span>
        </label>

        <div class="pg-actions">
          <a class="pg-btn pg-btn--lg pg-btn--secondary" th:href="@{/request/document}" th:text="${@bi.t('cta.back')}">Back · Bumalik</a>
          <button class="pg-btn pg-btn--lg pg-btn--primary" type="submit" th:text="${@bi.t('resident.cta.review')}">Review · Suriin</button>
        </div>
      </main>
    </form>

    <script>
      // Shows the Senior tag as soon as the age is 60 or more. The server decides the real priority.
      const age = document.getElementById("age");
      const tag = document.getElementById("seniorTag");
      const update = () => { tag.hidden = !(parseInt(age.value, 10) >= 60); };
      age.addEventListener("input", update);
      update();
    </script>
  </body>
</html>
