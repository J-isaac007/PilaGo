<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PilaGo · Display board</title>
    <link rel="icon" th:href="@{/favicon.ico}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/pilago.css}" href="../../static/css/pilago.css" />
    <link rel="stylesheet" th:href="@{/css/display.css}" href="../../static/css/display.css" />
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  </head>
  <body class="tv">
    <header class="tv-bar">
      <div class="tv-brand">
        <img th:src="@{/img/pilago-logo-white.svg}" src="../../static/img/pilago-logo-white.svg" alt="" />
        <div><b>PilaGo</b><small>Brgy. San Isidro</small></div>
      </div>
      <div class="tv-right">
  <div class="tv-clock"><b id="time">9:41 AM</b><small id="date">Tuesday, Nov 3, 2026</small></div>
  <button id="sound-btn" class="tv-sound" type="button" th:text="${@bi.t('display.sound-on')}">Turn on sound</button>
  <span id="sound-done" style="display:none" th:text="${@bi.t('display.sound-done')}">Sound on</span>
</div>
    </header>

    <!-- Polled every 3 s: only this fragment is re-rendered by GET /display/board -->
    <main class="tv-board" th:fragment="board" th:attr="hx-get=@{/display/board}" hx-trigger="every 3s" hx-swap="outerHTML">
     <section class="tv-panel tv-serving" aria-live="polite">
  <span class="tv-counter-no" style="display:none" th:text="${board.counter}">1</span>
  <div class="tv-label" th:text="${@bi.t('display.now-serving')}">Now serving</div>
        <div th:if="${board.nowServing != null}" class="tv-hero" th:text="${board.nowServing}">C-003</div>
        <div th:if="${board.nowServing == null}" class="tv-hero tv-hero--empty">—</div>
        <div th:if="${board.nowServing != null}" class="tv-counter"
             th:text="${@bi.t('display.go-counter', board.counter)}">Go to Counter 1</div>
        <div th:if="${!board.next.isEmpty()}" class="tv-next">
          <span class="tv-next__label" th:remove="tag" th:text="${@bi.t('cta.next')} + ':'">Next</span>
          <span th:each="n : ${board.next}" th:text="${n}">P-005</span>
        </div>
      </section>

      <div class="tv-side">
       <section class="tv-panel tv-waiting">
          <div class="tv-label" th:text="${@bi.t('status.waiting')} + ' (' + ${board.waitingCount} + ')'">Waiting</div>
          <ul class="tv-list">
            <li th:each="t : ${board.waiting}">
              <span class="tv-num" th:text="${t.number}">P-005</span>
              <span th:if="${t.priority.priority}" class="pg-tag" th:classappend="'pg-tag--' + ${t.priority.cssModifier}"
                    th:text="${@bi.t(t.priority.messageKey)}">PWD</span>
            </li>
          </ul>
          <p th:if="${board.waiting.isEmpty()}" class="tv-none" th:text="${@bi.t('display.none-waiting')}">No one waiting</p>
        </section>

        <section class="tv-panel tv-ready">
          <div class="tv-label" th:text="${@bi.t('display.ready')}">Ready for release</div>
          <span th:each="r : ${board.ready}" class="tv-num" th:text="${r}">S-002</span>
          <p th:if="${board.ready.isEmpty()}" class="tv-none" th:text="${@bi.t('display.none-ready')}">None yet</p>
        </section>
      </div>
    </main>

    <footer class="tv-foot">
      <p><span th:text="${@bi.t('display.footer.priority')}">Seniors (60+) and PWD are served first</span> &nbsp;•&nbsp;
        <span th:text="${@bi.t('display.footer.get')}">Get your ticket on your phone:</span>
        <span th:text="${publicUrl}">pilago-sanisidro.onrender.com</span></p>
        <img class="tv-qr" th:src="@{/qr/home.png}" width="120" height="120" th:alt="${@bi.t('display.qr-alt')}" alt="QR code" />
    </footer>
    
    <script th:src="@{/js/board.js}" defer></script>
    <script>
      // Clock in Manila time (the server may run in UTC).
      function tick() {
        const now = new Date(), tz = { timeZone: "Asia/Manila" };
        document.getElementById("time").textContent =
          now.toLocaleTimeString("en-US", { ...tz, hour: "numeric", minute: "2-digit" });
        document.getElementById("date").textContent =
          now.toLocaleDateString("en-US", { ...tz, weekday: "long", month: "short", day: "numeric", year: "numeric" });
      }
      tick();
      setInterval(tick, 1000);
    </script>
  </body>
</html>
