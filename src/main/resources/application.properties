spring.application.name=PilaGo

# Profiles: "dev" (H2, default on your laptop) and "prod" (Postgres on Neon, set on Render).
spring.profiles.default=dev

# Page text, English only (matching Figma since 2026-11-23).
#   messages.properties           shared words: statuses, documents, buttons, errors (Isaac)
#   messages_resident.properties  resident pages and TV board (Carryl)
#   messages_staff.properties     staff and captain pages (Precious)
spring.messages.basename=messages,messages_resident,messages_staff
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# JPA: tables are created and updated from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Show friendly error pages instead of stack traces.
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false

# Staff accounts created on first start if none exist (see DataSeeder).
pilago.seed.secretary-id=SEC-001
pilago.seed.secretary-name=Maria Santos
pilago.seed.captain-id=CAP-001
pilago.seed.captain-name=Hon. Roberto Mendoza
