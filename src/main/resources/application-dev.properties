# Local development: H2 database saved in ./data (git-ignored). Delete the folder to start fresh.
spring.datasource.url=jdbc:h2:file:./data/pilago;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Templates and CSS reload without restarting.
spring.thymeleaf.cache=false

# Dev-only staff passwords. Never use these on Render.
pilago.seed.secretary-password=secretary123
pilago.seed.captain-password=captain123
